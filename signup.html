<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join CYBERWORLD</title><link rel="icon" href="assets/earth-logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body class="login-page">
<header class="topbar"><a class="brand" href="index.html"><img src="assets/earth-logo.svg" alt=""><span>CYBER<span>WORLD</span></span></a><nav><a href="index.html">Log in</a></nav></header>
<main class="signup-wrap"><section class="auth-card signup-card"><h2>Join the World</h2><p class="muted">Create your CYBERWORLD account</p>
<form id="signup-form">
<label class="field"><span>♙</span><input name="name" placeholder="Your full name" autocomplete="name" required></label>
<label class="field"><span>✉</span><input name="email" type="email" placeholder="Email address" autocomplete="email" required></label>
<label class="field"><span>⌖</span><input name="username" placeholder="Choose a username" required minlength="3"></label>
<label class="field"><span>♙</span><input name="password" type="password" placeholder="Create password (8+ characters)" required minlength="8"></label>
<label class="remember terms"><input type="checkbox" required> I agree to the community rules and privacy terms.</label>
<button class="primary-btn" type="submit">Create Account <span>→</span></button></form>
<p class="signup-prompt">Already a member? <a href="index.html">Log in</a></p><p class="small-note">This is a front-end starter. It does not save accounts yet.</p>
</section></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="js/app.js"></script></body></html>
